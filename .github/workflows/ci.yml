name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore GripenLink.slnx

      - run: dotnet build GripenLink.slnx --no-restore

      - run: dotnet test GripenLink.slnx --no-build --verbosity normal
